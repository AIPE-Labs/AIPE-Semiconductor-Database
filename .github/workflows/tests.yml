name: V3 checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: pytest -q
      - run: python examples/device_explorer_demo.py
      - run: python -m build
      - name: Check Core projections against AIPE-Core v0.1.0
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/AIPE-Labs/AIPE-Core.git ../AIPE-Core
          python -m pip install -r ../AIPE-Core/requirements-dev.txt
          python scripts/check_core_integration.py ../AIPE-Core
